name: Bug report
description: Something behaves incorrectly
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **If this is a security vulnerability, please do not file it here.**
        Report it privately via [Security Advisories](https://github.com/SNT01/agentGate/security/advisories/new)
        so it can be fixed before it becomes public. See [SECURITY.md](../blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you observe?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The commands you ran, and the output you got. Please redact keys and tokens.
      placeholder: |
        1. agentgate enroll --name "..."
        2. agentgate issue-agent --sponsor ...
        3. ...
      render: shell
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which part
      options:
        - CLI
        - Token broker
        - Identity registry
        - Enforcer / GitHub App
        - Credential helper
        - Docker deployment
        - Documentation
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: "1.0.0, or the commit SHA you tested"
    validations:
      required: true

  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node -v`
      placeholder: "v20.11.0"
    validations:
      required: true

  - type: textarea
    id: tests
    attributes:
      label: Do the tests pass on your machine?
      description: Output of `npm test`, if relevant.
      render: shell
